project:
  type: default
  render:
    - "slides/**/*.qmd"

# Configuración común a todas las slides del curso.
# Cada sesión hereda de aquí; se puede sobreescribir en el YAML de cada .qmd.
format:
  revealjs:
    theme: serif
    footer: "Curso de Series Temporales con Python"
    slide-number: c/t
    show-slide-number: all
    transition: fade
    transition-speed: fast
    highlight-style: github
    code-line-numbers: true
    code-overflow: wrap
    code-block-height: "600px"
    incremental: false
    progress: true
    history: true
    chalkboard: false
    fig-align: center
    fig-cap-location: bottom
    embed-resources: false   # cambiar a true para slides 100% portables (un solo HTML)
    mermaid:
      theme: neutral

# Ejecución de código Python
execute:
  freeze: auto    # cachea outputs; re-ejecuta solo cuando cambia el .qmd
  echo: true
  warning: false
  message: false

# Kernel de Jupyter (registrar desde el .venv con
# `uv run python -m ipykernel install --user --name curso-series-temporales ...`)
jupyter: curso-series-temporales

# Idioma
lang: es
