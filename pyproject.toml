[project]
name = "curso-series-temporales"
version = "0.1.0"
description = "Curso de series temporales con Python aplicado a hidrología e hidrogeología"
authors = [
    { name = "Alberto Torres", email = "alberto.torres@komorebi.ai" },
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core data stack
    "numpy>=1.26",
    "pandas>=2.2,<3",     # pastas 1.11 no soporta pandas 3.0 (freq 'D' rota)
    "scipy>=1.13",
    "openpyxl>=3.1",            # leer .xlsx (piezometría CHD)
    "python-calamine>=0.2",     # leer .xlsx del SAIH (openpyxl falla por atributos nuevos)
    # Visualización
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    # Series temporales (estadística clásica)
    "statsmodels>=0.14",
    "pastas>=1.5",
    "prophet>=1.1",
    # Machine learning clásico + forecasting
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "skforecast>=0.13",
    "shap>=0.45",
    # Deep learning (Sesión 4)
    "tensorflow>=2.16",
    "keras>=3.0",
    # Notebook / interactividad
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    # Utilidades
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cst"]

[tool.uv]
# Reproducibilidad: bloquear versiones en uv.lock
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
